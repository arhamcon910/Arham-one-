version: '3.9'

services:
  saarthi-desktop:
    image: node:20
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "5173:5173"
    command: sh -c "cd apps/saarthi-desktop && pnpm install && pnpm dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
